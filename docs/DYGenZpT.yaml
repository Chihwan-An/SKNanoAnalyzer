# Systematics for the DYGenZpT analyzer (gen-level DY Z-pT spectrum, NLO vs LO).
#
# THEORY ONLY. The observable is the generator-level Z pT, which is fixed before
# any detector simulation, so object- and correction-level nuisances (JES/JER,
# FatJetJES/JER, Electron/Muon ID-Reco-Res-Scale-Trig-Iso, LSF, Pileup) would
# reproduce Central bin-for-bin. They are deliberately left out: including them
# would multiply the output size by ~4 and the runtime by more than that for
# nothing.
#
# The four entries below are copied from docs/MCLRSM.yaml:86-99. All are pure
# weight variations (evtLoopAgain: false), so each becomes its own
# "<syst>_Up" / "<syst>_Down" directory and the event loop runs only once.
# Output directories: Central + 4 x {Up, Down} = 9.
#
# The correction derived downstream keeps LO fixed and varies only the NLO
# numerator, so this file is applied to the NLO sample; running it on the LO
# samples as well is harmless (those directories are simply not used).

systematics:

  - syst: "ScaleWeight_muF"
    target: "ScaleWeight_muF"
    evtLoopAgain: false

  - syst: "ScaleWeight_muR"
    target: "ScaleWeight_muR"
    evtLoopAgain: false

  - syst: "PDF"
    target: "PDF_Weight"
    evtLoopAgain: false

  - syst: "AlphaS"
    target: "AlphaS_Weight"
    evtLoopAgain: false
