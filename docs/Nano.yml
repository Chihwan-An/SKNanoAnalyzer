name: Nano
channels:
  - conda-forge
dependencies:
  # Human-readable solver input. For a byte-for-byte reproducible Linux setup,
  # prefer Nano-linux-64.lock as documented in GettingStarted.md.
  # Core compiler/runtime ABI. Keep ROOT and Cling on C++20.
  - python=3.12.8
  - root=6.40.02=py312heb52968_2
  - root_base=6.40.02=cxx20_h7ea46b7_2
  - root_cxx_standard=20
  - compilers=1.8.0
  - gcc=13.3.0
  - gxx=13.3.0
  - sysroot_linux-64=2.17
  - cmake=3.31.2

  # C++ libraries used directly by SKNanoAnalyzer.
  - libabseil=20260526.0
  - libhwy=1.4.0
  - correctionlib=2.6.4
  - onnxruntime-cpp=1.19.2=*_cpu
  - nlohmann_json=3.12.0

  # Unit tests. The suites under */tests are gtest and run through ctest;
  # see DevelopmentGuide.md.
  - gtest=1.17.0

  # Batch submission and Python analysis utilities.
  - htcondor
  - awkward
  - numpy
  - pyyaml
  - requests
  - tqdm
  - uproot
  - pip
