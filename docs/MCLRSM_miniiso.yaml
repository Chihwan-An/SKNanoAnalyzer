# Systematics for HNWR_miniiso / HNWR_miniiso_scan.
#
# Identical to MCLRSM.yaml (used by Reproduce20_002_copy) EXCEPT for the one entry
# marked below: those analyzers drop the LSF3 > 0.75 cut in favour of a miniIso cut
# on the subleading loose lepton, so the "LSF" nuisance is replaced by "MiniIso".
# Keep the rest of this file in sync with docs/MCLRSM.yaml.

systematics:

  - syst: "Pileup"
    target: "PU_Weight"
    evtLoopAgain: false

  - syst: "ElectronID"
    target: "E_Id_Weight"
    evtLoopAgain: false
  
  - syst: "ElectronReco"
    target: "E_Reco_Weight"
    evtLoopAgain: false

  - syst: "ElectronTrig"
    target: "E_Trig_Weight"
    evtLoopAgain: false

  - syst: "MuonID"
    target: "M_Id_Weight"
    evtLoopAgain: false

  - syst: "MuonReco"
    target: "M_Reco_Weight"
    evtLoopAgain: false
  
  - syst: "MuonTrig"
    target: "M_Trig_Weight"
    evtLoopAgain: false
  
  - syst: "MuonIso"
    target: "M_Iso_Weight"
    evtLoopAgain: false

  # >>> THE ONE ENTRY THAT DIFFERS FROM docs/MCLRSM.yaml <<<
  # Mini-isolation cut efficiency SF for the subleading loose lepton inside the fatjet,
  # the cut that replaces LSF3 > 0.75 in these analyzers. egamma-tnp measurement, so it
  # is applied for ELECTRONS ONLY: boosted SR EE and flavour CR mu-ejet. The muon-in-
  # fatjet regions (SR MM, flavour CR e-mujet) and every resolved region keep the
  # target at 1. See HNWR_miniiso::GetElectronMiniIsoSF_TnP.
  - syst: "MiniIso"
    target: "MiniIso_Weight"
    evtLoopAgain: false

  - syst: "JER"
    target: "JER_Variation"
    evtLoopAgain: true

  - syst: "JES"
    target: "JES_Variation"
    evtLoopAgain: true

  # --- object-level energy/momentum scale & resolution -------------------------------
  # evtLoopAgain: true -> the analyzer re-runs the event with the varied collection, see
  # Reproduce20_002_copy::executeEventFromParameter. Targets are dummies (the variation is
  # kinematic, not a weight), exactly like JER/JES above.

  # Muon momentum scale: Rochester error below 200 GeV, Generalized Endpoint kappa +- sigma
  # above. Both are stored on the muon by GetAllMuons via SetMomentumScaleUpDown.
  - syst: "MuonScale"
    target: "MuonScale_Variation"
    evtLoopAgain: true

  # Electron energy scale (EGM total_uncertainty, MC only).
  - syst: "ElectronScale"
    target: "ElectronScale_Variation"
    evtLoopAgain: true

  # Electron energy resolution (EGM err_rho, MC only).
  - syst: "ElectronRes"
    target: "ElectronRes_Variation"
    evtLoopAgain: true

  # AK8 JES / JER. The AK4 counterparts are the JES/JER entries above; AK8 is varied
  # separately because the two use different correction sets and are not fully correlated.
  - syst: "FatJetJES"
    target: "FatJetJES_Variation"
    evtLoopAgain: true

  - syst: "FatJetJER"
    target: "FatJetJER_Variation"
    evtLoopAgain: true

  # High-pT muon resolution: flat 10% additional smearing, identical for both eta regions
  # and all eras (Schulte & Zhong, "High-pT muon resolution measurement for 2022 and 2023",
  # 2024/06/03, conclusion slide). MC-only; the down side floors at "no smearing" because a
  # Gaussian convolution cannot sharpen MC, so this nuisance is one-sided in the barrel for
  # 2022 and 2023BPix (nominal smearing 0 there). Details:
  # /data9/Users/achihwan/25-020/AN-25-020/chihwan/fig/06_systematics/muon_highpt_recosf/README.md
  - syst: "MuonRes"
    target: "MuonRes_Variation"
    evtLoopAgain: true

  # XSec(theory) weight systematics: renormalization/factorization scale, PDF, alpha_S.
  # Pure weight variations (evtLoopAgain: false) -> each becomes its own "<syst>_Up/_Down" directory.
  - syst: "ScaleWeight_muF"
    target: "ScaleWeight_muF"
    evtLoopAgain: false

  - syst: "ScaleWeight_muR"
    target: "ScaleWeight_muR"
    evtLoopAgain: false

  # PDF: REMOVED. The Hessian envelope cannot be carried by a per-event weight (see
  # PDF_Weight in the analyzer): the quadrature sum runs over members of the OBSERVABLE,
  # not of the event weight, and the old target overestimated it by 38-157x in the signal
  # regions. It is now produced by the RunXsecSyst userflag as PDFmem<i>/<region>_mlljj
  # plus the offline tables/06_systematics/theory_norm_split/make_pdf_envelope.py, and
  # enters the datacard as the PDFAcc template rather than as a nuisance computed here.

  - syst: "AlphaS"
    target: "AlphaS_Weight"

  # DY gen Z-pT correction C(genZpT), NLO/LO. DY MC only; the targets stay at 1
  # for every other sample, so these directories are empty variations there.
  #
  # Only ZPtRw_MC_stat carries C at nominal -- the other three return 1 at
  # nominal and the ratio C_var/C_nom for their variation. calculateWeight()
  # multiplies the nominal of every target into the central weight, so four
  # targets each returning C would apply it four times.
  #
  # ZPtRw_MC_stat is the MC statistical error of C, taken from the bin errors of
  # the nominal ZPTReweight histogram. The other three are the theory variations
  # of the NLO numerator; LO is held fixed by construction. The four are
  # disjoint: ZPTReweight_Up/Down in the correction file is the quadrature sum
  # of the same three theory groups and is NOT used by any target here, because
  # it would double-count them and drop the statistical error.
  - syst: "ZPtRw_MC_stat"
    target: "ZPt_Weight"
    evtLoopAgain: false

  - syst: "ZPtRwQCDScale"
    target: "ZPt_QCDScale"
    evtLoopAgain: false

  - syst: "ZPtRwQCDPDFError"
    target: "ZPt_QCDPDFError"
    evtLoopAgain: false

  - syst: "ZPtRwQCDPDFAlphaS"
    target: "ZPt_QCDPDFAlphaS"
    evtLoopAgain: false

  # NLO EW correction EW(genZpT), arXiv:1705.04664, ported from SKFlat
  # HNWRAnalyzer (ZPtEWCorr.root). Same one-factor bookkeeping as C above:
  # ZPt_EW1 carries EW at nominal (and its e1 variation), ZPt_EW2/EW3 return 1
  # at nominal and the ratio EW_var/EW_nom, so Central gets EW exactly once.
  # The three sources are the independent EW uncertainties of the paper
  # (higher-order Sudakov logs / hard non-Sudakov NNLO / Sudakov approximation).
  - syst: "ZPtRwEW1"
    target: "ZPt_EW1"
    evtLoopAgain: false

  - syst: "ZPtRwEW2"
    target: "ZPt_EW2"
    evtLoopAgain: false

  - syst: "ZPtRwEW3"
    target: "ZPt_EW3"
    evtLoopAgain: false




  
